[project]
name = "battlecode-tools"
version = "0.1.0"
description = "Reproducible UNSW Battlecode tournament and analytics tooling"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "rich>=13",
  "unswbc>=1.2.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bctool = "bctool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/bctool"]
