[project]
name = "battlecode-tools"
version = "0.1.0"
description = "Reproducible UNSW Battlecode tournament and analytics tooling"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "rich>=13",
  "tomli>=2; python_version < '3.11'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
bctool = "bctool.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/bctool"]
